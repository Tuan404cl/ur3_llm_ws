# moveit_simple_controller_manager configuration.
# Khớp với ros2_control controllers trong ur3_llm_tamp/config/controllers.yaml:
#   - /joint_trajectory_controller/follow_joint_trajectory (FollowJointTrajectory)
#   - /gripper_action_controller/gripper_cmd              (GripperCommand)
controller_names:
  - joint_trajectory_controller
  - gripper_action_controller

joint_trajectory_controller:
  action_ns: follow_joint_trajectory
  type: FollowJointTrajectory
  default: true
  joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint

gripper_action_controller:
  action_ns: gripper_cmd
  type: GripperCommand
  default: true
  joints:
    - robotiq_85_left_knuckle_joint
